openapi: 3.0.3
info:
  title: kdb3 API
  version: "1.0"
  description: |
    Document database with SQLite storage, change tracking, and incrementally
    updated materialized views.

    **Trust model:** design documents run SQL against SQLite. Prefer a Bearer
    token and a restricted bind address when not on localhost.
  contact:
    name: kdb3
servers:
  - url: /
    description: This kdb3 instance
tags:
  - name: Server
  - name: Databases
  - name: Documents
  - name: Bulk
  - name: Changes
  - name: Views
  - name: Admin
paths:
  /:
    get:
      tags: [Server]
      summary: Server info
      operationId: getInfo
      responses:
        "200":
          description: Server identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /_cat/dbs:
    get:
      tags: [Server]
      summary: List databases
      operationId: listDatabases
      responses:
        "200":
          description: Database names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: ["blog", "testdb"]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /_uuids:
    get:
      tags: [Server]
      summary: Generate document IDs
      operationId: getUUIDs
      parameters:
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Generated IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /metrics:
    get:
      tags: [Server]
      summary: Prometheus metrics
      description: |
        Exposes Prometheus text-format metrics (Go runtime, HTTP, and kdb3
        application metrics). Always public — no Bearer token required.
      operationId: getMetrics
      security: []
      responses:
        "200":
          description: Prometheus metrics scrape
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP kdb_databases_open Number of open databases.
                  # TYPE kdb_databases_open gauge
                  kdb_databases_open 0

  /{db}:
    parameters:
      - $ref: "#/components/parameters/db"
    get:
      tags: [Databases]
      summary: Database stats
      operationId: getDatabase
      responses:
        "200":
          description: Database statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Databases]
      summary: Create database
      operationId: putDatabase
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          description: Database already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Documents]
      summary: Create or update a document
      description: |
        Body must be JSON (`Content-Type: application/json`). If `_id` is omitted,
        one is assigned. Updates require the current `_rev`.
      operationId: postDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentWrite"
            example:
              _id: "1"
              title: "hello"
      responses:
        "200":
          description: Saved document meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          description: Unsupported Content-Type
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Databases]
      summary: Delete database
      operationId: deleteDatabase
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"

  /{db}/_all_docs:
    get:
      tags: [Documents]
      summary: List all documents
      description: Shortcut over `_design/_views/_all_docs`.
      operationId: allDocs
      parameters:
        - $ref: "#/components/parameters/db"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: include_docs
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: View result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllDocsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"

  /{db}/_changes:
    get:
      tags: [Changes]
      summary: Change feed
      description: |
        One-shot JSON feed (`feed=normal`, default) or continuous Server-Sent Events
        (`feed=eventsource`). SSE emits one `data:` JSON object per change and
        comment heartbeats about every 25s. Use a client that can send
        `Authorization` (e.g. fetch stream / share/js/follow.js); native EventSource
        cannot set Bearer headers.
      operationId: changes
      parameters:
        - $ref: "#/components/parameters/db"
        - name: since
          in: query
          schema:
            type: integer
            format: int64
            default: 0
          description: Return changes with update_seq greater than this value
        - name: limit
          in: query
          schema:
            type: integer
            default: 1000
          description: Max results; for eventsource, max rows per catch-up batch
        - name: descending
          in: query
          schema:
            type: boolean
            default: false
          description: Newest first when true (ignored for feed=eventsource)
        - name: feed
          in: query
          schema:
            type: string
            enum: [normal, eventsource]
            default: normal
          description: normal = one-shot JSON; eventsource = continuous SSE
      responses:
        "200":
          description: Changes (JSON) or SSE stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesResult"
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames. Change events are `data: {"update_seq", "id", "rev", "deleted"?}`.
                  Heartbeats are SSE comments (`: `).
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"

  /{db}/_bulk_docs:
    post:
      tags: [Bulk]
      summary: Bulk write documents
      operationId: bulkDocs
      parameters:
        - $ref: "#/components/parameters/db"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDocsRequest"
      responses:
        "200":
          description: Per-document results
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: "#/components/schemas/DocumentMeta"
                    - $ref: "#/components/schemas/BulkItemError"
        "409":
          description: Atomic bulk write failed (all_or_nothing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkFailedResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "406":
          description: Unsupported Content-Type

  /{db}/_bulk_gets:
    post:
      tags: [Bulk]
      summary: Bulk get documents
      operationId: bulkGets
      parameters:
        - $ref: "#/components/parameters/db"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkGetsRequest"
      responses:
        "200":
          description: Per-document results (full docs or errors)
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: "#/components/schemas/Document"
                    - $ref: "#/components/schemas/BulkItemError"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "406":
          description: Unsupported Content-Type

  /{db}/_vacuum:
    post:
      tags: [Admin]
      summary: Vacuum database
      operationId: vacuum
      parameters:
        - $ref: "#/components/parameters/db"
      responses:
        "200":
          description: Vacuum started/completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"

  /{db}/{docid}:
    parameters:
      - $ref: "#/components/parameters/db"
      - $ref: "#/components/parameters/docid"
    get:
      tags: [Documents]
      summary: Get document
      operationId: getDocument
      parameters:
        - name: rev
          in: query
          schema:
            type: integer
          description: Optional revision to fetch
      responses:
        "200":
          description: Document
          headers:
            E-Tag:
              schema:
                type: string
              description: Document revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
    head:
      tags: [Documents]
      summary: Document existence / E-Tag
      operationId: headDocument
      parameters:
        - name: rev
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Exists
          headers:
            E-Tag:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Documents]
      summary: Create or update document by ID
      operationId: putDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentWrite"
      responses:
        "200":
          description: Saved document meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "406":
          description: Unsupported Content-Type
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Documents]
      summary: Delete document
      operationId: deleteDocument
      parameters:
        - name: rev
          in: query
          required: true
          schema:
            type: integer
          description: Current revision (required)
      responses:
        "200":
          description: Tombstone meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /{db}/_design/{docid}:
    parameters:
      - $ref: "#/components/parameters/db"
      - $ref: "#/components/parameters/designDocid"
    get:
      tags: [Views]
      summary: Get design document
      operationId: getDesignDocument
      responses:
        "200":
          description: Design document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [Views]
      summary: Create or update design document (POST)
      operationId: postDesignDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignDocument"
      responses:
        "200":
          description: Saved design doc meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "406":
          description: Unsupported Content-Type
        "409":
          $ref: "#/components/responses/Error"
    put:
      tags: [Views]
      summary: Create or update design document (PUT)
      operationId: putDesignDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignDocument"
      responses:
        "200":
          description: Saved design doc meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "406":
          description: Unsupported Content-Type
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Views]
      summary: Delete design document
      operationId: deleteDesignDocument
      parameters:
        - name: rev
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tombstone meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentMeta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /{db}/_design/{docid}/{view}/_dry_run:
    post:
      tags: [Admin]
      summary: Dry-run draft view SQL against a docs sequence window
      description: |
        Executes unsaved setup/run (and optional select) in an in-memory scratch DB
        attached read-only to the live documents database. Does not write view files.
      operationId: dryRunView
      parameters:
        - $ref: "#/components/parameters/db"
        - $ref: "#/components/parameters/designDocid"
        - $ref: "#/components/parameters/view"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewAtelierDryRunRequest"
      responses:
        "200":
          description: Dry-run succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewAtelierDryRunResult"
        "400":
          description: Invalid SQL (structured diagnostics)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewAtelierDryRunResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "406":
          description: Unsupported Content-Type

  /{db}/_design/{docid}/{view}/_status:
    get:
      tags: [Admin]
      summary: View catch-up status (lag badge)
      operationId: viewStatus
      parameters:
        - $ref: "#/components/parameters/db"
        - $ref: "#/components/parameters/designDocid"
        - $ref: "#/components/parameters/view"
      responses:
        "200":
          description: View vs database update_seq
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"

  /{db}/_design/{docid}/{view}:
    get:
      tags: [Views]
      summary: Execute view (default select)
      operationId: selectView
      parameters:
        - $ref: "#/components/parameters/db"
        - $ref: "#/components/parameters/designDocid"
        - $ref: "#/components/parameters/view"
        - $ref: "#/components/parameters/stale"
        - $ref: "#/components/parameters/include_docs"
      responses:
        "200":
          description: View select result (shape defined by the view SQL)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"

  /{db}/_design/{docid}/{view}/{select}:
    get:
      tags: [Views]
      summary: Execute named view select
      operationId: selectViewNamed
      parameters:
        - $ref: "#/components/parameters/db"
        - $ref: "#/components/parameters/designDocid"
        - $ref: "#/components/parameters/view"
        - $ref: "#/components/parameters/select"
        - $ref: "#/components/parameters/stale"
        - $ref: "#/components/parameters/include_docs"
      responses:
        "200":
          description: View select result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Required when the server was started with `-token` or `KDB3_TOKEN`.
        Swagger UI and `/_docs` themselves are public; authorize here before Try it out.

  parameters:
    db:
      name: db
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9_]{1,50}$"
      description: Database name (`[a-z0-9_]`, 1–50 chars, not starting with `_`)
      example: testdb
    docid:
      name: docid
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_]{1,50}$"
      description: Document ID
      example: "1"
    designDocid:
      name: docid
      in: path
      required: true
      schema:
        type: string
      description: Design document name without `_design/` prefix
      example: _views
    view:
      name: view
      in: path
      required: true
      schema:
        type: string
      example: _all_docs
    select:
      name: select
      in: path
      required: true
      schema:
        type: string
      example: default
    stale:
      name: stale
      in: query
      schema:
        type: boolean
        default: false
      description: If true, read without waiting for the view to catch up
    include_docs:
      name: include_docs
      in: query
      schema:
        type: boolean
        default: false
      description: Prefer `{select}_with_docs` when present

  schemas:
    OK:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    ServerInfo:
      type: object
      properties:
        name:
          type: string
          example: kdb3
        version:
          type: object
          properties:
            kdb3:
              type: string
              example: "1.0.0"
            commit:
              type: string
              example: "abc1234"
            sqlite:
              type: string
              example: "3.53.4"

    DatabaseStat:
      type: object
      properties:
        name:
          type: string
        update_seq:
          type: integer
          format: int64
        doc_count:
          type: integer
        deleted_doc_count:
          type: integer
      example:
        name: testdb
        update_seq: 1
        doc_count: 1
        deleted_doc_count: 0

    DocumentMeta:
      type: object
      required: [_id, _rev]
      properties:
        _id:
          type: string
        _rev:
          type: integer
        _deleted:
          type: boolean

    DocumentWrite:
      type: object
      additionalProperties: true
      properties:
        _id:
          type: string
        _rev:
          type: integer
        _deleted:
          type: boolean

    Document:
      type: object
      additionalProperties: true
      required: [_id, _rev]
      properties:
        _id:
          type: string
        _rev:
          type: integer

    DesignDocumentView:
      type: object
      properties:
        setup:
          type: array
          items:
            type: string
          description: SQL DDL run when the view DB opens
        run:
          type: array
          items:
            type: string
          description: Incremental update SQL using latest_changes / latest_documents
        select:
          type: object
          additionalProperties:
            type: string
          description: Named select queries; `${param}` placeholders from query string

    ViewAtelierDryRunRequest:
      type: object
      properties:
        setup:
          type: array
          items:
            type: string
        run:
          type: array
          items:
            type: string
        select:
          type: object
          additionalProperties:
            type: string
        since:
          type: integer
          format: int64
          default: 0
          description: Sequence window start (exclusive)
        limit:
          type: integer
          default: 300
          description: Max documents in the dry-run window
        select_name:
          type: string
          default: default
        params:
          type: object
          additionalProperties:
            type: string
          description: Values for `${param}` placeholders in the named select
        include_sql:
          type: boolean
          default: false
          description: When true, include generated INSERT changeset SQL

    ViewAtelierSQLError:
      type: object
      properties:
        phase:
          type: string
          enum: [setup, run, select, keyword]
        index:
          type: integer
        sql:
          type: string
        message:
          type: string

    ViewAtelierTableCount:
      type: object
      properties:
        name:
          type: string
        rows:
          type: integer
          format: int64

    ViewAtelierDryRunResult:
      type: object
      required: [ok, since, errors]
      properties:
        ok:
          type: boolean
        since:
          type: integer
          format: int64
        current_update_seq:
          type: integer
          format: int64
        next_update_seq:
          type: integer
          format: int64
        docs_in_window:
          type: integer
          format: int64
        tables:
          type: array
          items:
            $ref: "#/components/schemas/ViewAtelierTableCount"
        result:
          description: Named select JSON result when select ran successfully
        generated_sql:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ViewAtelierSQLError"
        error:
          type: string
        reason:
          type: string

    ViewStatus:
      type: object
      required: [db_update_seq, view_update_seq, lag, open, built]
      properties:
        db_update_seq:
          type: integer
          format: int64
        view_update_seq:
          type: integer
          format: int64
        lag:
          type: integer
          format: int64
          description: db_update_seq minus view_update_seq (clamped at 0)
        open:
          type: boolean
          description: Whether the view is currently open in memory
        built:
          type: boolean
          description: Whether a persistent view file exists

    DesignDocument:
      type: object
      required: [_id, views]
      properties:
        _id:
          type: string
          example: _design/posts
        _rev:
          type: integer
        views:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DesignDocumentView"

    BulkDocsRequest:
      type: object
      required: [_docs]
      properties:
        all_or_nothing:
          type: boolean
          default: false
          description: |
            When true, the batch is atomic: if any document fails validation or
            write, no documents from the batch are committed. On failure the
            response is HTTP 409 with a bulk_failed envelope and per-item results.
        _docs:
          type: array
          items:
            $ref: "#/components/schemas/DocumentWrite"

    BulkGetsRequest:
      type: object
      required: [_docs]
      properties:
        _docs:
          type: array
          items:
            type: object
            required: [_id]
            properties:
              _id:
                type: string
              _rev:
                type: integer

    BulkItemError:
      type: object
      properties:
        _id:
          type: string
        error:
          type: string
        reason:
          type: string

    BulkFailedResponse:
      type: object
      required: [error, reason, results]
      properties:
        error:
          type: string
          example: bulk_failed
        reason:
          type: string
          example: one or more documents failed; no changes were committed
        results:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/DocumentMeta"
              - $ref: "#/components/schemas/BulkItemError"

    ChangesResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              update_seq:
                type: integer
                format: int64
              id:
                type: string
              rev:
                type: integer
              deleted:
                type: boolean
        last_seq:
          type: integer
          format: int64
          description: Highest update_seq in results, or since when empty

    AllDocsResult:
      type: object
      properties:
        offset:
          type: integer
        total_rows:
          type: integer
        rows:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              id:
                type: string
              rev:
                type: integer
              doc:
                $ref: "#/components/schemas/Document"

    Error:
      type: object
      properties:
        error:
          type: string
          example: db_not_found
        reason:
          type: string
          example: database not found

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unauthorized
            reason: missing or invalid bearer token
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

security:
  - bearerAuth: []
  - {}
